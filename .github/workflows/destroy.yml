name: Terraform Automated Destroy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - destroy

jobs:
  terraform-destroy:
    name: Destroy web app and service plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -reconfigure -input=false
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Terraform
        run: terraform validate
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Track existing web app and service plan in remote state
        shell: bash
        run: |
          state="$(terraform state list)"

          if ! grep -Fxq 'azurerm_linux_web_app.main' <<< "$state"; then
            terraform import -input=false \
              azurerm_linux_web_app.main \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/Yogi_Terform/providers/Microsoft.Web/sites/yogiwebapp"
          fi

          state="$(terraform state list)"
          if ! grep -Fxq 'azurerm_service_plan.webapp' <<< "$state"; then
            terraform import -input=false \
              azurerm_service_plan.webapp \
              "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/Yogi_Terform/providers/Microsoft.Web/serverfarms/yogiwebapp-plan"
          fi

          terraform state list
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Plan targeted destroy
        run: |
          terraform plan -destroy \
            -target=azurerm_linux_web_app.main \
            -target=azurerm_service_plan.webapp \
            -input=false \
            -out=destroy.tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify destroy plan only removes the web app and service plan
        run: |
          terraform show -json destroy.tfplan | python3 -c '
          import json
          import sys

          plan = json.load(sys.stdin)
          deleted = sorted(
              resource["address"]
              for resource in plan.get("resource_changes", [])
              if "delete" in resource["change"]["actions"]
          )
          expected = sorted([
              "azurerm_linux_web_app.main",
              "azurerm_service_plan.webapp",
          ])

          if deleted != expected:
              print(f"Refusing destroy; planned deletions were: {deleted}", file=sys.stderr)
              sys.exit(1)

          print("Verified destroy plan: web app and service plan only.")
          '

      - name: Apply destroy plan
        if: github.event.inputs.action == 'destroy'
        run: terraform apply -auto-approve -input=false destroy.tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
